<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitHub file review fixture</title>
    <style>
      body { font: 14px system-ui; margin: 30px; }
      .js-file, .new-file-card { border: 1px solid #d0d7de; border-radius: 6px; margin: 16px 0; }
      .file-header { align-items: center; background: #f6f8fa; display: flex; gap: 10px; padding: 10px; }
      pre { margin: 0; padding: 18px; }
      .js-file.reviewed pre, .new-file-card.reviewed pre { display: none; }
    </style>
  </head>
  <body>
    <h1>Files changed</h1>
    <div class="js-file" data-path="src/button.ts">
      <div class="file-header"><strong>src/button.ts</strong><label><input class="js-reviewed-checkbox" type="checkbox" /> Viewed</label></div>
      <pre>export const Button = {};</pre>
    </div>
    <div class="js-file" data-path="src/__test__/button.ts" data-review-delay="120">
      <div class="file-header"><strong>src/__test__/button.ts</strong><label><input class="js-reviewed-checkbox" type="checkbox" /> Viewed</label></div>
      <pre>test('button', () =&gt; {});</pre>
    </div>
    <div class="js-file" data-path="src/menu.__test__.ts" data-review-delay="260">
      <div class="file-header"><strong>src/menu.__test__.ts</strong><label><input class="js-reviewed-checkbox" type="checkbox" /> Viewed</label></div>
      <pre>test('menu', () =&gt; {});</pre>
    </div>
    <section class="new-file-card" data-review-delay="400">
      <div class="file-header"><a href="#diff-dialog">src/dialog.test.tsx</a><button type="button" aria-label="Viewed" aria-pressed="false">Viewed</button></div>
      <pre>test('dialog', () =&gt; {});</pre>
    </section>
    <script>
      for (const checkbox of document.querySelectorAll('.js-reviewed-checkbox')) {
        checkbox.addEventListener('change', () => {
          const file = checkbox.closest('.js-file');
          const delay = Number(file.dataset.reviewDelay ?? 0);
          setTimeout(() => file.classList.toggle('reviewed', checkbox.checked), delay);
        });
      }
      for (const button of document.querySelectorAll('button[aria-pressed]')) {
        button.addEventListener('click', () => {
          const viewed = button.getAttribute('aria-pressed') === 'true';
          button.setAttribute('aria-pressed', String(!viewed));
          const file = button.closest('.new-file-card');
          const delay = Number(file.dataset.reviewDelay ?? 0);
          setTimeout(() => file.classList.toggle('reviewed', !viewed), delay);
        });
      }
    </script>
    <script src="/dist/content.js"></script>
  </body>
</html>
